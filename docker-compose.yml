services:
  postgres:
    image: postgres:16
    container_name: scanex-postgres
    environment:
      POSTGRES_DB: scanex
      POSTGRES_USER: scanex
      POSTGRES_PASSWORD: scanex_pw
    ports:
      - "5432:5432"
    volumes:
      - scanex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanex -d scanex"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  scanex_pgdata: